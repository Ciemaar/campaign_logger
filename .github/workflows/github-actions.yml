name: build
on: [push, pull_request]
jobs:
  bootstrap-drift:
    # ci/templates/ is the source for tox.ini and this workflow. Dependabot only ever
    # edits the generated files, so without this check the two silently diverge and the
    # next `tox -e bootstrap` reverts whatever dependabot landed. See issue #34.
    name: 'bootstrap drift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: install bootstrap dependencies
      run: python -mpip install --progress-bar=off jinja2 matrix
    - name: regenerate from ci/templates
      run: python ci/bootstrap.py --no-env
    - name: fail if the generated files are out of date
      run: |
        if ! git diff --exit-code; then
          echo "::error::Generated files differ from ci/templates/."
          echo "Run 'tox -e bootstrap' (or 'python ci/bootstrap.py --no-env') and commit the result."
          echo "If you changed .github/workflows/*.yml or tox.ini by hand, make the same change in ci/templates/."
          exit 1
        fi

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'check'
            python: '3.11'
            toxpython: 'python3.11'
            tox_env: 'check'
            os: 'ubuntu-latest'
          - name: 'docs'
            python: '3.11'
            toxpython: 'python3.11'
            tox_env: 'docs'
            os: 'ubuntu-latest'
          - name: 'py311-cover (ubuntu)'
            python: '3.11'
            toxpython: 'python3.11'
            python_arch: 'x64'
            tox_env: 'py311-cover'
            os: 'ubuntu-latest'
          - name: 'py311-cover (windows)'
            python: '3.11'
            toxpython: 'python3.11'
            python_arch: 'x64'
            tox_env: 'py311-cover'
            os: 'windows-latest'
          - name: 'py311-cover (macos)'
            python: '3.11'
            toxpython: 'python3.11'
            python_arch: 'x64'
            tox_env: 'py311-cover'
            os: 'macos-latest'
          - name: 'py311-nocov (ubuntu)'
            python: '3.11'
            toxpython: 'python3.11'
            python_arch: 'x64'
            tox_env: 'py311-nocov'
            os: 'ubuntu-latest'
          - name: 'py311-nocov (windows)'
            python: '3.11'
            toxpython: 'python3.11'
            python_arch: 'x64'
            tox_env: 'py311-nocov'
            os: 'windows-latest'
          - name: 'py311-nocov (macos)'
            python: '3.11'
            toxpython: 'python3.11'
            python_arch: 'x64'
            tox_env: 'py311-nocov'
            os: 'macos-latest'
          - name: 'py312-cover (ubuntu)'
            python: '3.12'
            toxpython: 'python3.12'
            python_arch: 'x64'
            tox_env: 'py312-cover'
            os: 'ubuntu-latest'
          - name: 'py312-cover (windows)'
            python: '3.12'
            toxpython: 'python3.12'
            python_arch: 'x64'
            tox_env: 'py312-cover'
            os: 'windows-latest'
          - name: 'py312-cover (macos)'
            python: '3.12'
            toxpython: 'python3.12'
            python_arch: 'x64'
            tox_env: 'py312-cover'
            os: 'macos-latest'
          - name: 'py312-nocov (ubuntu)'
            python: '3.12'
            toxpython: 'python3.12'
            python_arch: 'x64'
            tox_env: 'py312-nocov'
            os: 'ubuntu-latest'
          - name: 'py312-nocov (windows)'
            python: '3.12'
            toxpython: 'python3.12'
            python_arch: 'x64'
            tox_env: 'py312-nocov'
            os: 'windows-latest'
          - name: 'py312-nocov (macos)'
            python: '3.12'
            toxpython: 'python3.12'
            python_arch: 'x64'
            tox_env: 'py312-nocov'
            os: 'macos-latest'
          - name: 'py313-cover (ubuntu)'
            python: '3.13'
            toxpython: 'python3.13'
            python_arch: 'x64'
            tox_env: 'py313-cover'
            os: 'ubuntu-latest'
          - name: 'py313-cover (windows)'
            python: '3.13'
            toxpython: 'python3.13'
            python_arch: 'x64'
            tox_env: 'py313-cover'
            os: 'windows-latest'
          - name: 'py313-cover (macos)'
            python: '3.13'
            toxpython: 'python3.13'
            python_arch: 'x64'
            tox_env: 'py313-cover'
            os: 'macos-latest'
          - name: 'py313-nocov (ubuntu)'
            python: '3.13'
            toxpython: 'python3.13'
            python_arch: 'x64'
            tox_env: 'py313-nocov'
            os: 'ubuntu-latest'
          - name: 'py313-nocov (windows)'
            python: '3.13'
            toxpython: 'python3.13'
            python_arch: 'x64'
            tox_env: 'py313-nocov'
            os: 'windows-latest'
          - name: 'py313-nocov (macos)'
            python: '3.13'
            toxpython: 'python3.13'
            python_arch: 'x64'
            tox_env: 'py313-nocov'
            os: 'macos-latest'
          - name: 'py314-cover (ubuntu)'
            python: '3.14'
            toxpython: 'python3.14'
            python_arch: 'x64'
            tox_env: 'py314-cover'
            os: 'ubuntu-latest'
          - name: 'py314-cover (windows)'
            python: '3.14'
            toxpython: 'python3.14'
            python_arch: 'x64'
            tox_env: 'py314-cover'
            os: 'windows-latest'
          - name: 'py314-cover (macos)'
            python: '3.14'
            toxpython: 'python3.14'
            python_arch: 'x64'
            tox_env: 'py314-cover'
            os: 'macos-latest'
          - name: 'py314-nocov (ubuntu)'
            python: '3.14'
            toxpython: 'python3.14'
            python_arch: 'x64'
            tox_env: 'py314-nocov'
            os: 'ubuntu-latest'
          - name: 'py314-nocov (windows)'
            python: '3.14'
            toxpython: 'python3.14'
            python_arch: 'x64'
            tox_env: 'py314-nocov'
            os: 'windows-latest'
          - name: 'py314-nocov (macos)'
            python: '3.14'
            toxpython: 'python3.14'
            python_arch: 'x64'
            tox_env: 'py314-nocov'
            os: 'macos-latest'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: install gettext
      if: runner.os == 'macOS'
      run: |
        brew install gettext
        brew link --force gettext
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.python_arch }}
        allow-prereleases: true
    - name: install dependencies
      shell: bash
      run: |
        python -mpip install --progress-bar=off -r ci/requirements.txt
        virtualenv --version
        pip --version
        tox --version
        pip list --format=freeze
    - name: test
      env:
        TOXPYTHON: '${{ matrix.toxpython }}'
      run: >
        tox -e ${{ matrix.tox_env }} -v
