version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # .github/workflows/*.yml are generated from ci/templates/. Without this entry
  # dependabot bumps only the generated copies, the templates go stale, and the next
  # `tox -e bootstrap` reverts the bumps. The `bootstrap drift` CI job detects that;
  # this entry is what prevents it. See issue #34.
  - package-ecosystem: "github-actions"
    directory: "/ci/templates"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  # `uv.lock` pins transitive dependencies that are not in `pyproject.toml`, so the
  # `pip` entry above never sees them. `urllib3` is one: `requests` brings it in, and
  # a vulnerable pin sat in the lock until `uv audit` failed CI. `indirect` limits this
  # entry to exactly those, so it does not duplicate the direct bumps `pip` already
  # opens. Dependabot alerts and security updates are repository settings, not this file.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "indirect"
