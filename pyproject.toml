[build-system]
requires = [
    "setuptools>=30.3.0",
    "wheel",
]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D104"]
"ci/*" = ["D"]
"setup.py" = ["D"]
"docs/conf.py" = ["D"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["campaign_logger"]
forced-separate = ["test_campaign_logger"]
default-section = "third-party"

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "basic"
