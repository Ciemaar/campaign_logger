[build-system]
requires = [
    "setuptools>=30.3.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D104"]
"ci/*" = ["D"]
"setup.py" = ["D"]
"docs/conf.py" = ["D"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["campaign_logger"]
forced-separate = ["test_campaign_logger"]
default-section = "third-party"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
norecursedirs = [
    ".git",
    ".tox",
    ".env",
    "dist",
    "build",
    "migrations"
]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py"
]
addopts = [
    "-ra",
    "--strict-markers",
    "--ignore=docs/conf.py",
    "--ignore=setup.py",
    "--ignore=ci",
    "--ignore=.eggs",
    "--doctest-modules",
    "--doctest-glob=\\*.rst",
    "--tb=short",
    "--pyargs",
    "--cov=campaign_logger",
    "--cov-report=term-missing",
    "--cov-fail-under=95"
]
testpaths = [
    "campaign_logger",
    "tests/"
]

[tool.coverage.run]
branch = true
source = ["campaign_logger"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.check-manifest]
ignore = [
    "AGENTS.md",
    "SESSION_INSTRUCTIONS.md",
    "PYPI_UPLOAD_INSTRUCTIONS.md"
]

[project]
name = "campaign-logger"
version = "0.0.1"
description = "A module to support interaction with campaign logger https://campaign-logger.com/."
authors = [{name = "Andy Fundinger", email = "andy@ciemaar.com"}]
license = {text = "LGPL-3.0-or-later"}
requires-python = ">=3.11"
readme = "README.rst"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
dependencies = [
    "click",
    "requests",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "requests-mock",
    "pytest",
    "pytest-cov",
    "pytest-mock"
]

[project.urls]
"Documentation" = "https://campaign_logger.readthedocs.io/"
"Changelog" = "https://campaign_logger.readthedocs.io/en/latest/changelog.html"
"Issue Tracker" = "https://github.com/Ciemaar/campaign_logger/issues"

[project.scripts]
campaign-logger = "campaign_logger.cli:main"
