[build-system]
requires = [
    "setuptools>=30.3.0",
    "wheel",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D104"]
"ci/*" = ["D"]
"setup.py" = ["D"]
"docs/conf.py" = ["D"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["campaign_logger"]
forced-separate = ["test_campaign_logger"]
default-section = "third-party"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
norecursedirs = [
    ".git",
    ".tox",
    ".env",
    "dist",
    "build",
    "migrations"
]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py"
]
addopts = [
    "-ra",
    "--strict-markers",
    "--ignore=docs/conf.py",
    "--ignore=setup.py",
    "--ignore=ci",
    "--ignore=.eggs",
    "--doctest-modules",
    "--doctest-glob=\\*.rst",
    "--tb=short",
    "--pyargs",
    "--cov=campaign_logger",
    "--cov-report=term-missing",
    "--cov-fail-under=95"
]
testpaths = [
    "campaign_logger",
    "tests/"
]

[tool.coverage.run]
branch = true
source = ["campaign_logger"]

[tool.coverage.report]
show_missing = true
fail_under = 95
