name: build
on: [push, pull_request]

# Least privilege: nothing here writes to the repository. Without an explicit block
# the jobs inherit the repository default, which may be read-write.
permissions:
  contents: read

jobs:
  bootstrap-drift:
    # ci/templates/ is the source for tox.ini and this workflow. Dependabot only ever
    # edits the generated files, so without this check the two silently diverge and the
    # next `tox -e bootstrap` reverts whatever dependabot landed. See issue #34.
    name: 'bootstrap drift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install bootstrap dependencies
      run: python -mpip install --progress-bar=off jinja2 matrix
    - name: regenerate from ci/templates
      run: python ci/bootstrap.py --no-env
    - name: fail if the generated files are out of date
      run: |
        if ! git diff --exit-code; then
          echo "::error::Generated files differ from ci/templates/."
          echo "Run 'tox -e bootstrap' (or 'python ci/bootstrap.py --no-env') and commit the result."
          echo "If you changed .github/workflows/*.yml or tox.ini by hand, make the same change in ci/templates/."
          exit 1
        fi

  action-versions:
    # audit.yml was silently reverted to older action pins by two pull requests that
    # were not about CI (issue #61). The bootstrap drift job cannot catch it: audit.yml
    # has no template. This compares the *merge result* against the base, because a
    # branch's own diff shows nothing -- the version lines appear as unchanged context.
    name: 'action versions'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        # merge-tree needs both sides of the merge, so the full history is required.
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: fail if merging would downgrade a pinned action
      run: python ci/check_action_versions.py "{{ '${{ github.event.pull_request.base.sha }}' }}" "{{ '${{ github.sha }}' }}"

  test:
    name: {{ '${{ matrix.name }}' }}
    runs-on: {{ '${{ matrix.os }}' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'check'
            python: '3.14'
            toxpython: 'python3.14'
            tox_env: 'check'
            os: 'ubuntu-latest'
          - name: 'docs'
            python: '3.14'
            toxpython: 'python3.14'
            tox_env: 'docs'
            os: 'ubuntu-latest'
{% for env in tox_environments %}
{% set prefix = env.split('-')[0] -%}
{% if prefix.startswith('pypy') %}
{% set python %}pypy-{{ prefix[4] }}.{{ prefix[5] }}{% endset %}
{% set cpython %}pp{{ prefix[4:] }}{% endset %}
{% set toxpython %}pypy{{ prefix[4:] }}{% endset %}
{% else %}
{% set python %}{{ prefix[2] }}.{{ prefix[3:] }}{% endset %}
{% set cpython %}cp{{ prefix[2:] }}{% endset %}
{% set toxpython %}python{{ prefix[2] }}.{{ prefix[3:] }}{% endset %}
{% endif %}
{% for os, python_arch in [
    ['ubuntu', 'x64'],
    ['windows', 'x64'],
    ['macos', 'x64'],
] %}
          - name: '{{ env }} ({{ os }})'
            python: '{{ python }}'
            toxpython: '{{ toxpython }}'
            python_arch: '{{ python_arch }}'
            tox_env: '{{ env }}'
            os: '{{ os }}-latest'
{% endfor %}
{% endfor %}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: install gettext
      if: runner.os == 'macOS'
      run: |
        brew install gettext
        brew link --force gettext
    - uses: actions/setup-python@v7
      with:
        python-version: {{ '${{ matrix.python }}' }}
        architecture: {{ '${{ matrix.python_arch }}' }}
        allow-prereleases: true
    - name: install dependencies
      shell: bash
      run: |
        python -mpip install --progress-bar=off -r ci/requirements.txt
        virtualenv --version
        pip --version
        tox --version
        pip list --format=freeze
    - name: test
      env:
        TOXPYTHON: '{{ '${{ matrix.toxpython }}' }}'
      run: >
        tox -e {{ '${{ matrix.tox_env }}' }} -v
