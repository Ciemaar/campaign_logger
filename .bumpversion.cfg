# Keep `current_version` equal to the version in pyproject.toml,
# src/campaign_logger/__init__.py and docs/conf.py. bumpversion reads the current
# version from here, not from the package, so a mismatch makes every `search`
# below miss and the run fail (issue #48).
[bumpversion]
current_version = 0.0.1
commit = True
tag = True

# The quoting has to match the files exactly. These used single quotes while the
# files use double, so the stanzas could not have matched even with the version
# reconciled.
[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:src/campaign_logger/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:docs/conf.py]
search = version = release = "{current_version}"
replace = version = release = "{new_version}"

[bumpversion:file (badge):README.rst]
search = /v{current_version}.svg
replace = /v{new_version}.svg

[bumpversion:file (link):README.rst]
search = /v{current_version}...main
replace = /v{new_version}...main
