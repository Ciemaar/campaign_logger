[tox]
envlist =
    clean,
    check,
    docs,
    py314-cover,
    py314-nocov,
    py315-cover,
    py315-nocov,
    report

[testenv]
basepython =
    {bootstrap,clean,check,report,docs,codecov,coveralls}: {env:TOXPYTHON:python3}
setenv =
    PYTHONPATH={toxinidir}/tests
    PYTHONUNBUFFERED=yes
passenv =
    *
deps =
    pytest
extras =
    test
commands =
    {posargs:pytest -vv --ignore=src}

[testenv:bootstrap]
deps =
    jinja2
    matrix
skip_install = true
commands =
    python ci/bootstrap.py --no-env

[testenv:check]
deps =
    docutils
    check-manifest
    readme-renderer
    pygments
    ruff
    pyright
    mdformat
    rstfmt
    setuptools<70.0.0
    build
    twine
    jinja2
    matrix
    sphinx
    sphinx_py3doc_enhanced_theme
    pytest
    pytest-cov
    requests-mock
    click
    pydantic
    requests
    mcp
skip_install = true
commands =
    python -m build --sdist --wheel .
    twine check dist/*
    check-manifest {toxinidir}
    ruff check .
    ruff format --check .
    pyright .
    mdformat --check --wrap 80 README.md SESSION_INSTRUCTIONS.md PYPI_UPLOAD_INSTRUCTIONS.md AGENTS.md .github/copilot-instructions.md docs/tooling_evaluation.md
    rstfmt --check AUTHORS.rst CONTRIBUTING.rst README.rst CHANGELOG.rst docs/usage.rst docs/reference/index.rst docs/installation.rst docs/readme.rst docs/contributing.rst docs/authors.rst docs/changelog.rst docs/index.rst

[testenv:docs]
usedevelop = true
deps =
    -r{toxinidir}/docs/requirements.txt
commands =
    sphinx-build {posargs:-E} -b doctest docs dist/docs
    sphinx-build {posargs:-E} -b html docs dist/docs
    - sphinx-build -b linkcheck docs dist/docs


[testenv:report]
deps = coverage
skip_install = true
commands =
    coverage report
    coverage html

[testenv:clean]
commands = coverage erase
skip_install = true
deps = coverage

[testenv:py314-cover]
setenv =
    {[testenv]setenv}
usedevelop = true
commands =
    {posargs:pytest -vv --cov=campaign_logger --cov-fail-under=95 --cov-report=term-missing}
deps =
    {[testenv]deps}
    pytest-cov

[testenv:py314-nocov]

[testenv:py315-cover]
setenv =
    {[testenv]setenv}
usedevelop = true
commands =
    {posargs:pytest -vv --cov=campaign_logger --cov-fail-under=95 --cov-report=term-missing}
deps =
    {[testenv]deps}
    pytest-cov

[testenv:py315-nocov]
